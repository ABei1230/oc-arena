
<!DOCTYPE html> <html lang="zh-CN"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"> <title>学院擂台赛 · 后端大厅版</title> <style> *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;} body{background:#0a0e1a;color:#e5e7eb;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px;} .title{font-size:18px;font-weight:800;letter-spacing:2px;background:linear-gradient(90deg,#60a5fa,#a78bfa,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:8px 0 12px;} .menu{display:flex;gap:14px;margin-bottom:16px;flex-wrap:wrap;justify-content:center;} .menu button{padding:13px 24px;border-radius:12px;border:1px solid #334155;background:#1e293b;color:#e5e7eb;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;} .menu button.primary{background:#2563eb;border-color:#2563eb;} .panel{display:none;width:100%;max-width:720px;background:#111827;border:1px solid #1e293b;border-radius:16px;padding:20px;margin-bottom:14px;} .panel.show{display:block;} .panel h2{font-size:15px;color:#94a3b8;margin-bottom:14px;} .field{margin-bottom:12px;} .field label{display:block;font-size:13px;color:#94a3b8;margin-bottom:5px;} .field input{width:100%;padding:10px 12px;border-radius:9px;border:1px solid #334155;background:#0f172a;color:#e5e7eb;font-size:14px;outline:none;font-family:inherit;} .field input:focus{border-color:#2563eb;} .row{display:flex;gap:10px;flex-wrap:wrap;} .row .field{flex:1;min-width:110px;} .btn{padding:11px 20px;border-radius:10px;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;} .btn-blue{background:#2563eb;color:#fff;} .btn-green{background:#059669;color:#fff;} .btn-red{background:#dc2626;color:#fff;} .btn-gray{background:#374151;color:#e5e7eb;} .btn-purple{background:#7c3aed;color:#fff;} .oc-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:14px;border-bottom:1px solid #1e293b;} .oc-tab{flex:0 0 auto;padding:9px 16px;border-radius:10px;background:#0f172a;border:1px solid #1e293b;color:#94a3b8;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;} .oc-tab.active{background:#2563eb;border-color:#2563eb;color:#fff;} .oc-tab.add{background:transparent;border-style:dashed;} .section-title{font-size:13px;color:#64748b;margin:16px 0 10px;display:flex;align-items:center;gap:8px;} .section-title::after{content:'';flex:1;height:1px;background:#1e293b;} .player-list{list-style:none;} .player-list li{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:10px;background:#0f172a;border:1px solid #1e293b;margin-bottom:8px;} .player-list .info{display:flex;align-items:center;gap:10px;min-width:0;flex:1;} .player-list .avatar{width:36px;height:36px;border-radius:50%;flex:0 0 auto;background:#334155;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#94a3b8;} .player-list .avatar.ghost{background:#1e1b4b;color:#a5b4fc;} .player-list .name{font-weight:700;font-size:14px;} .player-list .pw{font-size:12px;color:#64748b;} .empty-tip{color:#475569;font-size:13px;text-align:center;padding:20px 0;} .op-tag{display:inline-block;padding:1px 6px;border-radius:5px;background:#7f1d1d;color:#fca5a5;font-size:10px;font-weight:800;margin-left:6px;} .op-warning{margin-top:10px;padding:10px 12px;border-radius:9px;background:rgba(220,38,38,.12);border:1px solid rgba(220,38,38,.4);color:#fca5a5;font-size:12px;display:none;} .op-warning.show{display:block;} .power-display{text-align:center;padding:16px;border-radius:12px;background:#0f172a;border:1px solid #1e293b;margin:14px 0;} .power-display .num{font-size:42px;font-weight:900;background:linear-gradient(90deg,#fbbf24,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;} .power-display .label{font-size:12px;color:#64748b;margin-top:4px;} .search-box{display:flex;gap:8px;margin-bottom:14px;} .search-box input{flex:1;padding:11px 14px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#e5e7eb;font-size:14px;outline:none;font-family:inherit;} .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;align-items:center;justify-content:center;padding:20px;} .modal-overlay.show{display:flex;} .modal{background:#111827;border:1px solid #334155;border-radius:16px;padding:22px;max-width:380px;width:100%;text-align:center;} .modal h3{font-size:16px;margin-bottom:8px;} .modal p{font-size:13px;color:#94a3b8;margin-bottom:18px;line-height:1.7;} .modal .btns{display:flex;gap:10px;justify-content:center;} .modal .btns button{flex:1;padding:12px;border-radius:10px;border:none;font-size:14px;font-weight:700;cursor:pointer;} #battleScreen{display:none;width:100%;max-width:720px;} #battleScreen.show{display:block;} .vs-header{display:flex;gap:10px;align-items:center;justify-content:center;margin-bottom:14px;} .vs-card{flex:1;background:#111827;border:1px solid #1e293b;border-radius:14px;padding:12px;text-align:center;min-width:0;} .vs-card.mine{border-color:#2563eb;} .vs-card .avatar{width:48px;height:48px;border-radius:50%;background:#1e293b;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:900;} .vs-card .pname{font-size:14px;font-weight:700;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;} .vs-card .ppw{font-size:11px;color:#64748b;} .vs-badge{font-size:20px;font-weight:900;color:#fbbf24;padding:0 4px;} .hp-bar{height:12px;border-radius:6px;background:#1e293b;margin:7px 0;overflow:hidden;} .hp-fill{height:100%;border-radius:6px;transition:width .4s ease;} .hp-fill.blue{background:linear-gradient(90deg,#3b82f6,#60a5fa);} .hp-fill.pink{background:linear-gradient(90deg,#ec4899,#f472b6);} .battle-log{background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:12px;height:170px;overflow-y:auto;font-size:13px;line-height:1.75;margin-bottom:12px;} .battle-log .entry{padding:3px 0;border-bottom:1px solid rgba(255,255,255,.04);} .battle-log .dmg{color:#fbbf24;font-weight:700;} .battle-log .crit{color:#f472b6;font-weight:700;} .battle-log .heal{color:#4ade80;font-weight:700;} .battle-log .system{color:#60a5fa;font-style:italic;} .turn-indicator{text-align:center;font-size:13px;color:#94a3b8;margin-bottom:10px;} .turn-indicator.active{color:#4ade80;font-weight:700;} .action-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;} .action-btns button{flex:1 1 28%;min-width:92px;padding:12px 8px;border-radius:11px;border:none;font-size:13px;font-weight:800;cursor:pointer;color:#fff;} .action-btns button:disabled{opacity:.3;cursor:not-allowed;} .a-attack{background:#2563eb;}.a-defend{background:#059669;}.a-charge{background:#d97706;}.a-ult{background:#dc2626;}.a-magic{background:#7c3aed;}.a-heal{background:#0891b2;} .result-box{text-align:center;padding:26px 0;} .result-box .big{font-size:34px;font-weight:900;margin-bottom:10px;} .result-box .sub{font-size:14px;color:#94a3b8;margin-bottom:20px;} .float-text{position:fixed;font-weight:900;font-size:20px;z-index:200;pointer-events:none;animation:floatUp .8s ease-out forwards;} @keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1);}100%{opacity:0;transform:translateY(-50px) scale(1.3);}} #connStatus{font-size:12px;color:#64748b;margin-bottom:10px;text-align:center;} .toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:#1e293b;border:1px solid #334155;border-radius:10px;padding:12px 20px;font-size:13px;color:#e5e7eb;z-index:300;} .hint{font-size:12px;color:#475569;line-height:1.7;margin-top:8px;} </style> </head> <body>  <div class="title">⚔️ 学院擂台赛 · 后端大厅版</div> <div id="connStatus">正在连接服务器…</div>  <div class="menu">   <button class="primary" onclick="togglePanel('ocPanel')">📋 我的角色</button>   <button class="primary" onclick="togglePanel('lobbyPanel')">⚔️ 联机大厅</button> </div>  <div class="panel" id="ocPanel">   <h2>📋 我的角色</h2>   <div class="oc-tabs" id="ocTabs"></div>   <div class="field"><label>角色名称</label><input id="ocName" placeholder="给你的 OC 取名" maxlength="12"></div>   <div class="field"><label>角色简介</label><input id="ocDesc" placeholder="一句话描述（选填）" maxlength="40"></div>   <div class="section-title">基础属性（1~100）</div>   <div class="row">     <div class="field"><label>力量 STR</label><input type="number" id="str" min="1" max="100" value="50"></div>     <div class="field"><label>敏捷 AGI</label><input type="number" id="agi" min="1" max="100" value="50"></div>   </div>   <div class="row">     <div class="field"><label>防御 DEF</label><input type="number" id="def" min="1" max="100" value="50"></div>     <div class="field"><label>智力 INT</label><input type="number" id="int" min="1" max="100" value="50"></div>   </div>   <div class="row">     <div class="field"><label>体力 VIT</label><input type="number" id="vit" min="1" max="100" value="50"></div>     <div class="field"><label>幸运 LUK</label><input type="number" id="luk" min="1" max="100" value="50"></div>   </div>   <div class="section-title">熟练度（0~100）</div>   <div class="row">     <div class="field"><label>🔮 魔法</label><input type="number" id="magic" min="0" max="100" value="30"></div>     <div class="field"><label>⚗️ 魔药</label><input type="number" id="alchemy" min="0" max="100" value="30"></div>   </div>   <div class="row">     <div class="field"><label>🥊 体术</label><input type="number" id="combat" min="0" max="100" value="30"></div>     <div class="field"><label>🧠 战术</label><input type="number" id="tactic" min="0" max="100" value="30"></div>   </div>   <div style="display:flex;gap:10px;margin-top:8px;flex-wrap:wrap;">     <button class="btn btn-blue" onclick="calcAndSave()">🔮 保存角色</button>     <button class="btn btn-gray" onclick="randomStats()">🎲 随机</button>     <button class="btn btn-green" onclick="setAsActive()" id="btnSetActive" style="display:none;">✅ 设为出战</button>     <button class="btn btn-red" onclick="deleteCurrentOC()" id="btnDeleteOC" style="display:none;">🗑️ 删除</button>   </div>   <div class="power-display" id="powerBox" style="display:none;"><div class="num" id="powerNum">0</div><div class="label">战斗力</div></div>   <div class="op-warning" id="opWarning">⚠️ OP 角色：无法主动邀请真人，只能被搜到或打 AI</div>   <div id="saveTip" style="margin-top:12px;font-size:12px;color:#475569;"></div> </div>  <div class="panel" id="lobbyPanel">   <h2>⚔️ 联机大厅</h2>   <div class="search-box">     <input id="searchInput" placeholder="🔍 搜索 OC 名字…" oninput="renderLobby()">     <button class="btn btn-gray" onclick="refreshLobby()" style="padding:11px 18px;font-size:13px;">🔄</button>   </div>   <div class="section-title">🟢 在线玩家</div>   <ul class="player-list" id="playerList"><li><div class="empty-tip">正在加载…</div></li></ul>   <div class="section-title">👻 离线幽灵（其他玩家留下的 OC）</div>   <ul class="player-list" id="ghostList"><li><div class="empty-tip">暂无幽灵 OC</div></li></ul>   <div style="margin-top:14px;">     <button class="btn btn-green" onclick="startOfflineBattle()">🥊 离线切磋（对战 AI）</button>   </div>   <div class="hint">💡 服务器自动维护在线列表和幽灵 OC，无需手动建房。</div> </div>  <div id="battleScreen">   <div class="vs-header">     <div class="vs-card mine">       <div class="avatar" id="myAvatar">P1</div>       <div class="pname" id="myName">我的 OC</div>       <div class="ppw" id="myPw">战力 0</div>       <div class="hp-bar"><div class="hp-fill blue" id="myHpBar" style="width:100%"></div></div>       <div style="font-size:11px;color:#64748b;" id="myHpText">HP: 0/0</div>     </div>     <div class="vs-badge">VS</div>     <div class="vs-card">       <div class="avatar" id="opAvatar" style="color:#ec4899;">P2</div>       <div class="pname" id="opName">对手</div>       <div class="ppw" id="opPw">战力 0</div>       <div class="hp-bar"><div class="hp-fill pink" id="opHpBar" style="width:100%"></div></div>       <div style="font-size:11px;color:#64748b;" id="opHpText">HP: 0/0</div>     </div>   </div>   <div class="turn-indicator" id="turnIndicator">等待开始…</div>   <div class="battle-log" id="battleLog"></div>   <div class="action-btns" id="actionBtns">     <button class="a-attack" onclick="playerAction('attack')" id="btnAttack">⚔️ 普通攻击</button>     <button class="a-defend" onclick="playerAction('defend')" id="btnDefend">🛡️ 防御</button>     <button class="a-charge" onclick="playerAction('charge')" id="btnCharge">⚡ 蓄力</button>     <button class="a-magic" onclick="playerAction('magic')" id="btnMagic">✨ 魔法弹</button>     <button class="a-heal" onclick="playerAction('heal')" id="btnHeal">💚 治疗术</button>     <button class="a-ult" onclick="playerAction('ultimate')" id="btnUltimate">💥 必杀技</button>   </div>   <div class="result-box" id="resultBox" style="display:none;">     <div class="big" id="resultTitle"></div>     <div class="sub" id="resultSub"></div>     <button class="btn btn-blue" onclick="backToLobby()">🔙 返回大厅</button>   </div> </div>  <div class="modal-overlay" id="modalOverlay">   <div class="modal">     <h3 id="modalTitle">收到切磋邀请</h3>     <p id="modalBody"></p>     <div class="btns" id="modalBtns"></div>   </div> </div>  <script src="/socket.io/socket.io.js"></script> <script> var OP_THRESHOLD = 1300; var socket = null; var myId = null; var myOCList = [], activeOCId = null, myActiveOC = null; var onlinePlayers = {}, ghostOCs = {}; var battle = null, editingOCId = null; var AI_NAMES = ['影刃','疾风','玄铁','墨羽','霜语','烈阳','青岚','暗鸦','白露','焚星','逐月','孤鸿']; var STORE_KEY = 'arena_srv_ocs', ACTIVE_KEY = 'arena_srv_active';  function loadList(){try{return JSON.parse(localStorage.getItem(STORE_KEY))||[]}catch(e){return[]}} function saveList(){localStorage.setItem(STORE_KEY,JSON.stringify(myOCList));} function saveActive(){if(activeOCId)localStorage.setItem(ACTIVE_KEY,activeOCId);else localStorage.removeItem(ACTIVE_KEY);} function clampA(v){return Math.max(1,Math.min(100,Math.round(+v||50)));} function clampP(v){return Math.max(0,Math.min(100,Math.round(+v||0)));} function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});} function toast(m){var e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(function(){e.remove()},2200);} function makeRng(seed){var s=(seed>>>0)||1;return function(){s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296;};} function togglePanel(id){document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('show');});var el=document.getElementById(id);if(el)el.classList.add('show');if(id==='lobbyPanel')refreshLobby();}  function computeOC(b){   var o={id:b.id||('oc_'+Date.now()+'_'+Math.floor(Math.random()*9999)),     name:(b.name||'无名氏').slice(0,12),desc:(b.desc||'').slice(0,40),     str:clampA(b.str),agi:clampA(b.agi),def:clampA(b.def),int:clampA(b.int),vit:clampA(b.vit),luk:clampA(b.luk),     magic:clampP(b.magic),alchemy:clampP(b.alchemy),combat:clampP(b.combat),tactic:clampP(b.tactic)};   o.hpMax=Math.round(o.vit*12+o.def*4+o.combat*0.6);   o.atk=Math.round(o.str*1.6+o.int*0.4+o.combat*0.9);   o.red=Math.round(o.def*0.9+o.vit*0.3+o.tactic*0.35);   o.spd=Math.round(o.agi*1.2+o.luk*0.4+o.tactic*0.4);   o.crit=Math.min(65,Math.round(o.int*0.35+o.luk*0.25+o.tactic*0.3));   o.eva=Math.min(55,Math.round(o.agi*0.30+o.luk*0.25+o.tactic*0.2));   o.magicPower=Math.round(o.int*1.1+o.magic*1.6);   o.healPower=Math.round(o.int*0.5+o.alchemy*1.8+o.vit*0.3);   o.power=Math.round(o.str*2+o.agi*1.6+o.def*1.5+o.int*1.8+o.vit*2+o.luk*1.2+(o.magic+o.alchemy+o.combat+o.tactic)*1.5);   o.isOP=o.power>=OP_THRESHOLD;   return o; }  function renderTabs(){   var el=document.getElementById('ocTabs'),h='';   myOCList.forEach(function(oc){h+='<button class="oc-tab'+(oc.id===editingOCId?' active':'')+'" onclick="selectOC(\''+oc.id+'\')">'+esc(oc.name)+(oc.id===activeOCId?' ⭐':'')+'</button>';});   h+='<button class="oc-tab add" onclick="newOC()">＋ 新建</button>';   el.innerHTML=h; } function fillForm(oc){   document.getElementById('ocName').value=oc?oc.name:'';   document.getElementById('ocDesc').value=oc?oc.desc:'';   ['str','agi','def','int','vit','luk'].forEach(function(k){document.getElementById(k).value=oc?oc[k]:50;});   ['magic','alchemy','combat','tactic'].forEach(function(k){document.getElementById(k).value=oc?oc[k]:30;});   document.getElementById('btnSetActive').style.display=oc?'inline-block':'none';   document.getElementById('btnDeleteOC').style.display=oc?'inline-block':'none';   if(oc){var c=computeOC(oc);document.getElementById('powerBox').style.display='block';document.getElementById('powerNum').textContent=c.power;document.getElementById('opWarning').classList.toggle('show',c.isOP);}   else{document.getElementById('powerBox').style.display='none';document.getElementById('opWarning').classList.remove('show');}   document.getElementById('saveTip').textContent=''; } function readForm(){   return {id:editingOCId||undefined,name:document.getElementById('ocName').value.trim()||'无名氏',desc:document.getElementById('ocDesc').value.trim(),     str:document.getElementById('str').value,agi:document.getElementById('agi').value,def:document.getElementById('def').value,int:document.getElementById('int').value,     vit:document.getElementById('vit').value,luk:document.getElementById('luk').value,magic:document.getElementById('magic').value,alchemy:document.getElementById('alchemy').value,     combat:document.getElementById('combat').value,tactic:document.getElementById('tactic').value}; } function calcAndSave(){   var c=computeOC(readForm());   if(editingOCId){for(var i=0;i<myOCList.length;i++){if(myOCList[i].id===editingOCId){myOCList[i]=c;break;}}}   else{myOCList.push(c);editingOCId=c.id;}   if(!activeOCId){activeOCId=c.id;myActiveOC=c;}else if(activeOCId===c.id)myActiveOC=c;   saveList();saveActive();renderTabs();fillForm(c);   document.getElementById('saveTip').textContent='✅ 已保存';   document.getElementById('saveTip').style.color='#4ade80';   broadcastMe();toast('已保存'); } function selectOC(id){var oc=myOCList.find(function(x){return x.id===id});if(!oc)return;editingOCId=id;renderTabs();fillForm(oc);} function newOC(){editingOCId=null;renderTabs();fillForm(null);document.getElementById('ocName').focus();} function setAsActive(){if(!editingOCId)return;var oc=myOCList.find(function(x){return x.id===editingOCId});if(!oc)return;activeOCId=oc.id;myActiveOC=computeOC(oc);saveActive();renderTabs();broadcastMe();toast('已设为出战');} function deleteCurrentOC(){   if(!editingOCId)return;if(!confirm('确定删除？'))return;   myOCList=myOCList.filter(function(x){return x.id!==editingOCId});   if(activeOCId===editingOCId){activeOCId=myOCList.length?myOCList[0].id:null;myActiveOC=activeOCId?computeOC(myOCList[0]):null;}   editingOCId=myOCList.length?myOCList[0].id:null;   saveList();saveActive();renderTabs();   if(editingOCId)fillForm(myOCList.find(function(x){return x.id===editingOCId}));else fillForm(null);   broadcastMe();toast('已删除'); } function randomStats(){   var ids=['str','agi','def','int','vit','luk'],vals=[];   for(var i=0;i<6;i++)vals.push(Math.floor(Math.random()*70)+20);   var sum=vals.reduce(function(a,b){return a+b},0);   for(var j=0;j<6;j++)document.getElementById(ids[j]).value=clampA(Math.round(vals[j]*300/sum));   ['magic','alchemy','combat','tactic'].forEach(function(id){document.getElementById(id).value=Math.floor(Math.random()*80)+10;}); } function broadcastMe(){   if(!myActiveOC||!socket||!socket.connected)return;   socket.emit('join',{name:myActiveOC.name,power:myActiveOC.power,isOP:myActiveOC.isOP,oc:myActiveOC}); }  /* ===== Socket ===== */ function connectSocket(){   socket=io();   socket.on('connect',function(){     myId=socket.id;     document.getElementById('connStatus').textContent='✅ 已连接服务器 · ID: '+myId.slice(-6);     broadcastMe();   });   socket.on('disconnect',function(){document.getElementById('connStatus').textContent='⚠️ 与服务器断开';});   socket.on('lobby',function(data){     onlinePlayers=data.players||{};     delete onlinePlayers[myId];     ghostOCs=data.ghosts||{};     renderLobby();   });   socket.on('invite',function(m){showInvite(m.fromId,m.fromName,m.fromPower,m.fromIsOP);});   socket.on('inviteResult',function(m){toast(m.accepted?'对方接受了！':'对方拒绝：'+(m.reason||''));});   socket.on('matchStart',function(m){startBattleWithServer(m);});   socket.on('action',function(m){     if(!battle||battle.over||battle.turn!=='opponent')return;     var res=applyAction('opponent',m.type);     logAction(res);updateHp();     if(battle.myHp<=0){endBattle('lose');return;}     if(battle.opHp<=0){endBattle('win');return;}     battle.turn='me';setTurnUI(true);   }); } function refreshLobby(){/* 服务器会自动广播，无需操作 */}  function renderLobby(){   var q=(document.getElementById('searchInput').value||'').trim().toLowerCase();   var listEl=document.getElementById('playerList');   var keys=Object.keys(onlinePlayers).filter(function(k){return !q||(onlinePlayers[k].name||'').toLowerCase().indexOf(q)>=0;});   if(keys.length===0)listEl.innerHTML='<li><div class="empty-tip">'+(q?'无匹配':'暂无其他在线玩家')+'</div></li>';   else{     var h='';     keys.forEach(function(pid){       var p=onlinePlayers[pid];       h+='<li><div class="info"><div class="avatar">'+esc((p.name||'?').charAt(0))+'</div><div><div class="name">'+esc(p.name||'?')+(p.isOP?'<span class="op-tag">OP</span>':'')+'</div><div class="pw">战力 '+(p.power||0)+'</div></div></div><button class="btn btn-blue" style="padding:8px 14px;font-size:12px;" onclick="sendInvite(\''+pid+'\')">切磋</button></li>';     });     listEl.innerHTML=h;   }   var gEl=document.getElementById('ghostList');   var gk=Object.keys(ghostOCs).filter(function(k){return !q||(ghostOCs[k].name||'').toLowerCase().indexOf(q)>=0;});   if(gk.length===0)gEl.innerHTML='<li><div class="empty-tip">'+(q?'无匹配':'暂无幽灵 OC')+'</div></li>';   else{     var gh='';     gk.forEach(function(pid){       var g=ghostOCs[pid];       gh+='<li><div class="info"><div class="avatar ghost">👻</div><div><div class="name">'+esc(g.name||'?')+(g.isOP?'<span class="op-tag">OP</span>':'')+'</div><div class="pw">战力 '+(g.power||0)+' · 离线幽灵</div></div></div><button class="btn btn-purple" style="padding:8px 14px;font-size:12px;" onclick="challengeGhost(\''+pid+'\')">挑战</button></li>';     });     gEl.innerHTML=gh;   } }  function sendInvite(pid){   if(!myActiveOC){toast('请先创建角色');return;}   if(myActiveOC.isOP){toast('OP 角色无法主动邀请');return;}   socket.emit('invite',{toId:pid});   toast('邀请已发送…'); } function showInvite(fromId,name,power,isOP){   document.getElementById('modalTitle').textContent='⚔️ 切磋邀请';   document.getElementById('modalBody').innerHTML='玩家 <b style="color:#60a5fa">'+esc(name)+'</b>'+(isOP?' <span class="op-tag">OP</span>':'')+'<br>战力 '+power+'<br>是否接受？';   document.getElementById('modalBtns').innerHTML=     '<button style="background:#059669;color:#fff;" onclick="acceptInvite(\''+fromId+'\')">接受</button>'+     '<button style="background:#dc2626;color:#fff;" onclick="declineInvite(\''+fromId+'\')">拒绝</button>';   document.getElementById('modalOverlay').classList.add('show'); } function acceptInvite(fromId){document.getElementById('modalOverlay').classList.remove('show');socket.emit('accept',{toId:fromId});} function declineInvite(fromId){document.getElementById('modalOverlay').classList.remove('show');socket.emit('reject',{toId:fromId});} function challengeGhost(pid){   if(!myActiveOC){toast('请先创建角色');return;}   var g=ghostOCs[pid];if(!g||!g.oc)return;   var opOC=computeOC(g.oc);   launchBattle({opponent:opOC,isMyTurnFirst:true,network:false}); }  function generateAI(p){   var f=0.92+Math.random()*0.18;   function v(x){return Math.round(Math.max(1,Math.min(100,x*f*(1+(Math.random()-0.5)*0.28))));}   function vp(x){return Math.round(Math.max(0,Math.min(100,x*f*(1+(Math.random()-0.5)*0.3))));}   return computeOC({name:AI_NAMES[Math.floor(Math.random()*AI_NAMES.length)],desc:'训练场对手',     str:v(p.str),agi:v(p.agi),def:v(p.def),int:v(p.int),vit:v(p.vit),luk:v(p.luk),     magic:vp(p.magic),alchemy:vp(p.alchemy),combat:vp(p.combat),tactic:vp(p.tactic)}); } function startOfflineBattle(){if(!myActiveOC){toast('请先创建角色');return;}launchBattle({opponent:generateAI(myActiveOC),isMyTurnFirst:true,network:false});} function startBattleWithServer(m){   var opOC=computeOC(m.opponentOc);   launchBattle({opponent:opOC,seed:m.seed,isMyTurnFirst:m.myTurn,network:true,opponentId:m.opponentId}); }  function launchBattle(opts){   var opOC=opts.opponent;   var seed=opts.seed!=null?opts.seed:Math.floor(Math.random()*1000000000);   battle={seed:seed,rng:makeRng(seed),myOC:myActiveOC,opOC:opOC,     myHp:myActiveOC.hpMax,myHpMax:myActiveOC.hpMax,opHp:opOC.hpMax,opHpMax:opOC.hpMax,     turn:opts.isMyTurnFirst?'me':'opponent',over:false,network:!!opts.network,opponentId:opts.opponentId||null,     myDefending:false,opDefending:false,myCharged:false,opCharged:false,myUlt:1,opUlt:1,     myMagicUses:4,opMagicUses:4,myHealUses:3,opHealUses:3};   document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('show');});   document.getElementById('battleScreen').classList.add('show');   document.getElementById('myName').textContent=myActiveOC.name;   document.getElementById('myPw').textContent='战力 '+myActiveOC.power;   document.getElementById('myAvatar').textContent=myActiveOC.name.charAt(0);   document.getElementById('opName').textContent=opOC.name;   document.getElementById('opPw').textContent='战力 '+opOC.power;   document.getElementById('opAvatar').textContent=opOC.name.charAt(0);   document.getElementById('battleLog').innerHTML='';   document.getElementById('resultBox').style.display='none';   document.getElementById('actionBtns').style.display='flex';   updateHp();   addLog('system','⚔️ '+(opts.network?'🌐 真人切磋':'🤖 AI 切磋')+'：'+myActiveOC.name+' VS '+opOC.name);   if(opts.isMyTurnFirst){setTurnUI(true);}else{setTurnUI(false);if(!opts.network)setTimeout(aiTurn,800);} }  function applyAction(actor,type){   var b=battle,rng=b.rng;   var atkOC=actor==='me'?b.myOC:b.opOC,defOC=actor==='me'?b.opOC:b.myOC;   var defSide=actor==='me'?'opponent':'me';   var r1=rng(),r2=rng(),r3=rng();   var getHp=function(s){return s==='me'?b.myHp:b.opHp},setHp=function(s,v){if(s==='me')b.myHp=v;else b.opHp=v;};   var getDef=function(s){return s==='me'?b.myDefending:b.opDefending},setDef=function(s,v){if(s==='me')b.myDefending=v;else b.opDefending=v;};   var getChg=function(s){return s==='me'?b.myCharged:b.opCharged},setChg=function(s,v){if(s==='me')b.myCharged=v;else b.opCharged=v;};   var getUlt=function(s){return s==='me'?b.myUlt:b.opUlt},setUlt=function(s,v){if(s==='me')b.myUlt=v;else b.opUlt=v;};   var getMag=function(s){return s==='me'?b.myMagicUses:b.opMagicUses},setMag=function(s,v){if(s==='me')b.myMagicUses=v;else b.opMagicUses=v;};   var getHeal=function(s){return s==='me'?b.myHealUses:b.opHealUses},setHeal=function(s,v){if(s==='me')b.myHealUses=v;else b.opHealUses=v;};   var label=actor==='me'?'你':'对手';   var res={dmg:0,heal:0,log:'',cls:'system'};   if(type==='attack'){     if(r1*100<defOC.eva)res.log=label+'攻击被闪避！';     else{       var crit=r2*100<atkOC.crit,dmg=atkOC.atk*(0.85+r3*0.3);       if(crit)dmg*=1.8;if(getChg(actor)){dmg*=2.2;setChg(actor,false);}       dmg=dmg-defOC.red*0.5;if(getDef(defSide)){dmg*=0.5;setDef(defSide,false);}       dmg=Math.max(1,Math.round(dmg));res.dmg=dmg;setHp(defSide,Math.max(0,getHp(defSide)-dmg));       res.log=label+'攻击'+(crit?'【暴击】':'')+'造成 <span class="dmg">'+dmg+'</span> 伤害';res.cls=crit?'crit':'dmg';     }   }else if(type==='defend'){setDef(actor,true);res.log=label+'进入防御';}   else if(type==='charge'){setChg(actor,true);res.log=label+'开始蓄力！';}   else if(type==='ultimate'){     if(getUlt(actor)<=0)return res;setUlt(actor,0);     if(r1*100<defOC.eva*0.5)res.log=label+'必杀被闪避！';     else{       var d2=(atkOC.atk*2.2+atkOC.int*1.5+atkOC.magicPower*0.4)*(0.9+r3*0.2);       if(getChg(actor)){d2*=2.2;setChg(actor,false);}       d2=d2-defOC.red*0.3;if(getDef(defSide)){d2*=0.5;setDef(defSide,false);}       d2=Math.max(1,Math.round(d2));res.dmg=d2;setHp(defSide,Math.max(0,getHp(defSide)-d2));       res.log='💥 '+label+'必杀造成 <span class="crit">'+d2+'</span> 伤害！';res.cls='crit';     }   }else if(type==='magic'){     if(getMag(actor)<=0)return res;setMag(actor,getMag(actor)-1);     if(r1*100<defOC.eva*0.75)res.log=label+'魔法弹被闪避！';     else{       var d3=atkOC.magicPower*(0.9+r3*0.25)-defOC.red*0.2;       if(getDef(defSide)){d3*=0.5;setDef(defSide,false);}       d3=Math.max(1,Math.round(d3));res.dmg=d3;setHp(defSide,Math.max(0,getHp(defSide)-d3));       res.log='✨ '+label+'魔法弹造成 <span class="dmg">'+d3+'</span> 伤害';res.cls='dmg';     }   }else if(type==='heal'){     if(getHeal(actor)<=0)return res;setHeal(actor,getHeal(actor)-1);     var amt=Math.round(atkOC.healPower*(0.85+r3*0.3));     var maxHp=actor==='me'?b.myHpMax:b.opHpMax;     var nh=Math.min(maxHp,getHp(actor)+amt),actual=nh-getHp(actor);     setHp(actor,nh);res.heal=actual;res.log='💚 '+label+'恢复 <span class="heal">'+actual+'</span> HP';res.cls='heal';   }   return res; } function logAction(res){addLog(res.cls,res.log);if(res.dmg>0)floatText('-'+res.dmg,res.cls==='crit'?'#ef4444':'#fbbf24');else if(res.heal>0)floatText('+'+res.heal,'#4ade80');} function playerAction(type){   if(!battle||battle.over||battle.turn!=='me')return;   if(type==='ultimate'&&battle.myUlt<=0)return;   if(type==='magic'&&battle.myMagicUses<=0)return;   if(type==='heal'&&battle.myHealUses<=0)return;   setBtn(false);   var res=applyAction('me',type);   logAction(res);updateHp();   if(battle.network&&battle.opponentId)socket.emit('action',{toId:battle.opponentId,type:type});   if(battle.opHp<=0){endBattle('win');return;}   battle.turn='opponent';setTurnUI(false);   if(!battle.network)setTimeout(aiTurn,700+Math.random()*500); } function aiChoose(){   var b=battle,hpPct=b.opHp/b.opHpMax,myHpPct=b.myHp/b.myHpMax,r=Math.random();   if(hpPct<0.32){if(b.opHealUses>0&&r<0.6)return 'heal';if(r<0.78)return 'defend';}   if(hpPct<0.55&&b.opHealUses>0&&r<0.28)return 'heal';   if(b.opUlt>0&&(myHpPct<0.6||hpPct>0.7)&&r<0.32)return 'ultimate';   if(b.opMagicUses>0&&r<0.35)return 'magic';   if(!b.opCharged&&r<0.14)return 'charge';   return 'attack'; } function aiTurn(){   if(!battle||battle.over)return;   var res=applyAction('opponent',aiChoose());   logAction(res);updateHp();   if(battle.myHp<=0){endBattle('lose');return;}   if(battle.opHp<=0){endBattle('win');return;}   battle.turn='me';setTurnUI(true); } function setTurnUI(isMe){   var ind=document.getElementById('turnIndicator');   if(isMe){ind.textContent='🎯 你的回合';ind.classList.add('active');}   else{ind.textContent=battle.network?'⏳ 等待对手…':'⏳ 对手行动中…';ind.classList.remove('active');}   setBtn(isMe); } function setBtn(on){   var b=battle;if(!b)return;   document.getElementById('btnAttack').disabled=!on;   document.getElementById('btnDefend').disabled=!on;   document.getElementById('btnCharge').disabled=!on||b.myCharged;   document.getElementById('btnUltimate').disabled=!on||b.myUlt<=0;   document.getElementById('btnMagic').disabled=!on||b.myMagicUses<=0;   document.getElementById('btnHeal').disabled=!on||b.myHealUses<=0;   document.getElementById('btnMagic').textContent='✨ 魔法弹('+b.myMagicUses+')';   document.getElementById('btnHeal').textContent='💚 治疗术('+b.myHealUses+')';   document.getElementById('btnUltimate').textContent=b.myUlt>0?'💥 必杀技':'💥 已用完';   document.getElementById('btnCharge').textContent=b.myCharged?'⚡ 蓄力中':'⚡ 蓄力'; } function updateHp(){   if(!battle)return;   document.getElementById('myHpBar').style.width=Math.max(0,battle.myHp/battle.myHpMax*100)+'%';   document.getElementById('opHpBar').style.width=Math.max(0,battle.opHp/battle.opHpMax*100)+'%';   document.getElementById('myHpText').textContent='HP: '+battle.myHp+'/'+battle.myHpMax;   document.getElementById('opHpText').textContent='HP: '+battle.opHp+'/'+battle.opHpMax; } function addLog(cls,html){   var el=document.getElementById('battleLog'),d=document.createElement('div');   d.className='entry '+(cls||'');d.innerHTML=html;el.appendChild(d);el.scrollTop=el.scrollHeight;   while(el.children.length>80)el.removeChild(el.firstChild); } function floatText(t,c){   var e=document.createElement('div');e.className='float-text';e.textContent=t;e.style.color=c;   e.style.left=(35+Math.random()*30)+'%';e.style.top='40%';   document.body.appendChild(e);setTimeout(function(){e.remove()},900); } function endBattle(r){   battle.over=true;   document.getElementById('actionBtns').style.display='none';   document.getElementById('resultBox').style.display='block';   var t=document.getElementById('resultTitle'),s=document.getElementById('resultSub');   if(r==='win'){t.textContent='🏆 胜利！';t.style.color='#fbbf24';s.textContent='你击败了 '+battle.opOC.name;}   else{t.textContent='💀 败北';t.style.color='#ef4444';s.textContent='你被 '+battle.opOC.name+' 击败了…';}   document.getElementById('turnIndicator').textContent='切磋结束'; } function backToLobby(){   document.getElementById('battleScreen').classList.remove('show');   battle=null;togglePanel('lobbyPanel'); }  (function(){   myOCList=loadList();activeOCId=localStorage.getItem(ACTIVE_KEY)||null;   if(activeOCId){var f=myOCList.find(function(x){return x.id===activeOCId});if(f)myActiveOC=computeOC(f);else activeOCId=null;}   editingOCId=myOCList.length?myOCList[0].id:null;   renderTabs();   if(editingOCId)fillForm(myOCList.find(function(x){return x.id===editingOCId}));else fillForm(null);   connectSocket(); })(); </script> </body> </html>
